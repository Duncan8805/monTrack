name: Keep Supabase Active

on:
  schedule:
    # Run at 00:00 every Wednesday and Sunday
    - cron: '0 0 * * 0,3'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase to prevent project from pausing..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/accounts?select=id&limit=1")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 401 ] && [ "$HTTP_STATUS" -ne 403 ]; then
            echo "Unexpected status code. Check if URL/KEYS are correct."
            exit 1
          fi
